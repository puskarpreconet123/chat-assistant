version: '3.8'

services:
  # Node.js Chat Backend Service
  chat-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_app_backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/agent_chat
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - chat_network

  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: chat_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chat_network

  # Redis Cache & Pub/Sub Service
  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat_network

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: chat_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-app
    networks:
      - chat_network

volumes:
  mongo_data:
  redis_data:

networks:
  chat_network:
    driver: bridge
