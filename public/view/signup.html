<body class="bg-surface-deep text-on-surface min-h-screen flex flex-col relative overflow-x-hidden font-body-md">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/5 rounded-full blur-[100px]"></div>
</div>
<!-- TopNav (Suppressed per logic, minimal brand anchor only) -->
<header class="w-full flex justify-center py-8 z-10 relative">
<div class="font-display-lg text-display-lg text-primary tracking-tighter cursor-pointer hover:opacity-80 transition-opacity">
            LuxeBet
        </div>
</header>
<!-- Main Content: Signup Form -->
<main class="flex-grow flex items-center justify-center p-4 z-10 relative">
<div class="w-full max-w-[480px] md:max-w-[640px] lg:max-w-[720px] transition-all duration-300">
<div class="glass-panel rounded-xl p-8 md:p-10 w-full relative overflow-hidden">
<!-- Subtle internal top highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg gold-gradient-text mb-2">Join the Elite</h1>
<p class="text-text-muted font-body-md text-body-md">Create your LuxeBet account today</p>
</div>
<div id="errorMsg" class="hidden text-error bg-error-container/10 border border-error-container/20 text-sm rounded-lg p-3 text-center mb-4" style="color: #ffb4ab; background: rgba(147, 0, 10, 0.1); border: 1px solid rgba(147, 0, 10, 0.2);"></div>
<form class="space-y-6" onsubmit="handleSignup(event)">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative input-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">person</span>
<input class="w-full bg-surface-raised border border-transparent rounded-lg py-3 pl-12 pr-4 text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:ring-0 transition-colors font-body-md text-body-md" id="fullName" placeholder="John Doe" type="text" required/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative input-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">mail</span>
<input class="w-full bg-surface-raised border border-transparent rounded-lg py-3 pl-12 pr-4 text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:ring-0 transition-colors font-body-md text-body-md" id="email" placeholder="john@example.com" type="email" required/>
</div>
</div>
<!-- Phone -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="phone">Phone Number</label>
<div class="relative input-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">smartphone</span>
<input class="w-full bg-surface-raised border border-transparent rounded-lg py-3 pl-12 pr-4 text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:ring-0 transition-colors font-label-numeric text-label-numeric" id="phone" placeholder="+1 (555) 000-0000" type="tel" required/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative input-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">lock</span>
<input class="w-full bg-surface-raised border border-transparent rounded-lg py-3 pl-12 pr-12 text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:ring-0 transition-colors font-body-md text-body-md" id="password" placeholder="••••••••" type="password" required/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-primary transition-colors focus:outline-none" type="button" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined text-[20px]" id="passwordToggleIcon">visibility_off</span>
</button>
</div>
</div>
</div>

<div class="flex items-start gap-3 pt-2">
<div class="flex items-center h-6">

</div>
<label class="font-body-md text-body-md text-text-muted text-sm cursor-pointer select-none" for="terms">
                            I agree to the <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-2" href="#">Terms &amp; Conditions</a> and confirm I am 18+ years old.
                        </label>
</div>

<span id="btnText" class="relative z-10">Create Account</span>
<span class="material-symbols-outlined relative z-10 font-bold">arrow_forward</span>

<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>

<footer class="w-full mt-auto bg-surface-deep border-t border-white/5 py-8 px-6 flex flex-col items-center gap-4 z-10">
<div class="font-headline-lg text-headline-lg text-primary">LuxeBet</div>
<div class="flex flex-wrap justify-center gap-6 font-label-caps text-label-caps">

<a class="text-text-muted hover:text-secondary transition-colors opacity-80 hover:opacity-100 uppercase" href="#">Contact Support</a>
</div>
<div class="font-label-caps text-label-caps text-text-muted opacity-60 mt-4 text-center max-w-md">
            © 2024 LuxeBet Global. Responsible Gaming is our priority.
        </div>
</footer>
<script>
    // Auto-redirect if already logged in
    (function () {
        try {
            const cached = localStorage.getItem('chat_identity');
            if (cached) {
                const parsed = JSON.parse(cached);
                if (parsed && parsed.token && parsed.user) {
                    if (parsed.user.role === 'user') {
                        window.location.href = 'home.html';
                    } else {
                        window.location.href = '../chat.html';
                    }
                }
            }
        } catch (_) { localStorage.removeItem('chat_identity'); }
    })();

    let agentId = 'agent-alice'; // Fallback agent ID

    async function fetchAgents() {
        try {
            const res = await fetch('/api/v1/admin/agents');
            const data = await res.json();
            if (data.agents && data.agents.length > 0) {
                // Pick a random agent to assign users to
                const randomAgent = data.agents[Math.floor(Math.random() * data.agents.length)];
                agentId = randomAgent._id;
            }
        } catch (err) {
            console.error('Error fetching agents:', err);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchAgents();
    });

    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('password');
        const toggleIcon = document.getElementById('passwordToggleIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleIcon.textContent = 'visibility';
        } else {
            pwdInput.type = 'password';
            toggleIcon.textContent = 'visibility_off';
        }
    }

    function showError(msg) {
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
    }

    function hideError() {
        const errEl = document.getElementById('errorMsg');
        errEl.classList.add('hidden');
    }

    async function handleSignup(e) {
        e.preventDefault();
        hideError();

        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const terms = document.getElementById('terms').checked;

        if (!name) return showError('Full Name is required.');
        if (!email) return showError('Email address is required.');
        if (!phone) return showError('Phone Number is required.');
        if (!password || password.length < 3) return showError('Password must be at least 3 characters.');
        if (!terms) return showError('You must agree to the Terms & Conditions.');

        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        btn.disabled = true;
        const originalText = btnText.textContent;
        btnText.textContent = 'Creating Account...';

        try {
            const res = await fetch('/api/v1/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: email, emailId: email, name, agentId, password })
            });
            const data = await res.json();

            if (!res.ok) {
                showError(data.error || 'Failed to create account. Email address might already be taken.');
                return;
            }

            const user = data.user;
            if (user) {
                user._id = user._id || user.emailId;
                user.role = 'user';
            }

            // Save credentials and login automatically
            localStorage.setItem('chat_identity', JSON.stringify({
                role: 'user',
                token: data.token,
                user
            }));

            // Redirect to new dashboard
            window.location.href = 'home.html';
        } catch (err) {
            showError('Connection error. Please try again.');
            console.error(err);
        } finally {
            btn.disabled = false;
            btnText.textContent = originalText;
        }
    }
</script>
</body></html>
