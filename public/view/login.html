<script>
  // Auto-redirect if already logged in
  (function () {
    try {
      const hasCookie = document.cookie.split(';').some(c => c.trim().startsWith('token='));
      const cached = localStorage.getItem('chat_identity');
      
      if (!hasCookie && cached) {
        // Stale frontend session - cookie is missing
        localStorage.removeItem('chat_identity');
        return;
      }
      
      if (hasCookie && !cached) {
        // Missing frontend session - clear cookie to prevent loop
        document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        return;
      }

      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.token && parsed.user) {
          if (parsed.user.role === 'user') {
            window.location.href = 'home.html';
          } else {
            window.location.href = '../chat.html';
          }
        }
      }
    } catch (_) { 
      localStorage.removeItem('chat_identity'); 
      document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }
  })();

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('passwordToggleIcon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      toggleIcon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      toggleIcon.textContent = 'visibility_off';
    }
  }

  function showError(msg) {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }

  function hideError() {
    const errEl = document.getElementById('errorMsg');
    errEl.classList.add('hidden');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();

    const userId = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!userId) return showError('Please enter your Account ID.');
    if (!password) return showError('Please enter your password.');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const btnSpan = btn.querySelector('span:first-child');
    const originalText = btnSpan.textContent;
    btnSpan.textContent = 'Authenticating...';

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Authentication failed. Please verify your Account ID.');
        return;
      }

      const user = data.user;
      if (user) {
        user._id = user._id || user.userId;
      }

      // Save credentials
      localStorage.setItem('chat_identity', JSON.stringify({
        role: user.role,
        token: data.token,
        user
      }));

      // Redirect to appropriate dashboard based on user role
      if (user.role === 'agent') {
        window.location.href = '../chat.html';
      } else {
        window.location.href = 'home.html';
      }
    } catch (err) {
      showError('Connection error. Please check your network and try again.');
      console.error(err);
    } finally {
      btn.disabled = false;
      btnSpan.textContent = originalText;
    }
  }
</script>
