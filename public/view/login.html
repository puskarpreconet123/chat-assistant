<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Chat Assistant - Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary": "#008069",
            "primary-hover": "#016b57",
            "primary-light": "#d9fdd3",
            "bg-app": "#f0f2f5",
            "text-primary": "#111b21",
            "text-secondary": "#667781",
            "border-color": "#e9edef"
          },
          "fontFamily": {
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e9edef);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .bg-ambient {
      background: radial-gradient(circle at 50% 0%, rgba(0, 128, 105, 0.05), transparent 60%),
                  radial-gradient(circle at 100% 100%, rgba(0, 128, 105, 0.02), transparent 40%);
    }
    .btn-primary-gradient {
      background: #008069;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn-primary-gradient:hover {
      background: #016b57;
      box-shadow: 0 4px 12px rgba(0, 128, 105, 0.2);
    }
    .input-glow:focus {
      box-shadow: 0 0 0 1px #008069, 0 0 10px rgba(0, 128, 105, 0.1);
      border-color: #008069;
    }
  </style>
</head>
<body class="bg-bg-app text-text-primary min-h-screen flex items-center justify-center relative overflow-hidden antialiased">

<!-- Ambient Gradient Background -->
<div class="absolute inset-0 z-0 bg-ambient"></div>

<!-- Login Container -->
<main class="relative z-10 w-full max-w-[440px] px-6 py-12 flex flex-col items-center">
  <!-- Brand logo -->
  <div class="mb-8 text-center flex flex-col items-center gap-3">
    <div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/20">
      <span class="material-symbols-outlined text-[32px] font-medium">chat</span>
    </div>
    <h1 class="text-[1.8rem] font-bold text-primary tracking-tight">Chat Assistant</h1>
  </div>

  <!-- Main Card -->
  <div class="glass-card w-full rounded-2xl p-8 relative overflow-hidden">
    <!-- Brand Top Accent Line -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-primary"></div>
    
    <div class="text-center mb-8">
      <h2 class="text-xl font-bold text-text-primary mb-1">Welcome Back</h2>
      <p class="text-text-secondary text-sm">Log in to manage your chats</p>
    </div>

    <!-- Error Message banner -->
    <div id="errorMsg" class="hidden text-red-600 bg-red-50 border border-red-200 text-sm rounded-lg p-3 text-center mb-4"></div>

    <form class="space-y-5" onsubmit="handleLogin(event)">
      <!-- Input Group: Username -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider" for="username">Email Address</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">person</span>
          <input class="w-full bg-[#f8f9fa] border border-[#ccd0d5] rounded-xl py-3 pl-12 pr-4 text-text-primary placeholder-text-secondary/50 text-sm focus:outline-none input-glow transition-all duration-200" id="username" placeholder="Enter your email address" type="email" required/>
        </div>
      </div>

      <!-- Input Group: Password -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider" for="password">Password</label>
          <a class="text-xs font-bold text-primary hover:text-primary-hover transition-colors" href="#">Forgot Password?</a>
        </div>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">lock</span>
          <input class="w-full bg-[#f8f9fa] border border-[#ccd0d5] rounded-xl py-3 pl-12 pr-12 text-text-primary placeholder-text-secondary/50 text-sm focus:outline-none input-glow transition-all duration-200" id="password" placeholder="••••••••" type="password" required/>
          <button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary transition-colors" type="button" onclick="togglePasswordVisibility()">
            <span class="material-symbols-outlined text-[20px]" id="passwordToggleIcon">visibility_off</span>
          </button>
        </div>
      </div>

      <!-- Primary CTA -->
      <button id="submitBtn" class="w-full btn-primary-gradient rounded-xl py-3.5 px-6 mt-4 font-semibold text-sm flex justify-center items-center gap-2 relative overflow-hidden active:scale-[0.98] transition-all duration-200 shadow-md shadow-primary/10 hover:shadow-lg hover:shadow-primary/20" type="submit">
        <span>Login</span>
        <span class="material-symbols-outlined text-[18px]">login</span>
      </button>
    </form>
  </div>
</main>

<script>
  // Auto-redirect if already logged in
  (function () {
    try {
      const hasCookie = document.cookie.split(';').some(c => c.trim().startsWith('token='));
      const cached = localStorage.getItem('chat_identity');
      
      if (!hasCookie && cached) {
        // Stale frontend session - cookie is missing
        localStorage.removeItem('chat_identity');
        return;
      }
      
      if (hasCookie && !cached) {
        // Missing frontend session - clear cookie to prevent loop
        document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        return;
      }

      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.token && parsed.user) {
          if (parsed.user.role === 'user') {
            window.location.href = 'home.html';
          } else {
            window.location.href = '../chat.html';
          }
        }
      }
    } catch (_) { 
      localStorage.removeItem('chat_identity'); 
      document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }
  })();

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('passwordToggleIcon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      toggleIcon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      toggleIcon.textContent = 'visibility_off';
    }
  }

  function showError(msg) {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }

  function hideError() {
    const errEl = document.getElementById('errorMsg');
    errEl.classList.add('hidden');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();

    const emailId = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!emailId) return showError('Please enter your Email Address.');
    if (!password) return showError('Please enter your password.');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const btnSpan = btn.querySelector('span:first-child');
    const originalText = btnSpan.textContent;
    btnSpan.textContent = 'Authenticating...';

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Authentication failed. Please verify your Email Address.');
        return;
      }

      const user = data.user;
      if (user) {
        user._id = user._id || user.emailId;
        user.avatar = data.avatar || user.avatar || '';
      }

      // Save credentials
      localStorage.setItem('chat_identity', JSON.stringify({
        role: user.role,
        token: data.token,
        user
      }));

      // Redirect to appropriate dashboard based on user role
      if (user.role === 'agent') {
        window.location.href = '../chat.html';
      } else {
        window.location.href = 'home.html';
      }
    } catch (err) {
      showError('Connection error. Please check your network and try again.');
      console.error(err);
    } finally {
      btn.disabled = false;
      btnSpan.textContent = originalText;
    }
  }
</script>
</body>
</html>
