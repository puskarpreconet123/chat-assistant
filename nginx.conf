events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Security headers
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M; # Increased size for media/voice note uploads

    # Upstream Node.js application server
    upstream chat_backend {
        server chat-app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name 45.195.229.93 localhost;

        # REST API and Static UI routes
        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for API requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket support for Socket.io
        location /socket.io/ {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;

            # Headers required for WebSockets upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-lived persistent WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
